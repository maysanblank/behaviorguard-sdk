<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in · Arunika</title>
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<div class="auth">
  <div class="auth-l">
    <div class="auth-box">
      <a class="logo" href="index.html" id="logo"></a>
      <h1>Log in to Arunika</h1>
      <p class="lead">Manage your account, send transfers and pay bills in one place.</p>
      <div id="alasan"></div>
      <form id="f" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input class="input" id="email" type="email" autocomplete="username" required placeholder="name@example.com">
        </div>
        <div class="field">
          <label for="sandi">Password</label>
          <input class="input" id="sandi" type="password" autocomplete="current-password" required minlength="6">
          <div class="err" id="err" role="alert"></div>
        </div>
        <button class="btn btn-pri btn-block" type="submit">Log in</button>
      </form>
      <p class="small" style="margin-top:18px;text-align:center;color:var(--ink-3)">
        No account yet? <a href="signup.html"><b>Open an Arunika account</b></a>
      </p>
      <div class="note" id="note"></div>
    </div>
  </div>
  <div class="auth-r" aria-hidden="true">
    <p class="q">Passwords get stolen. The way you type, move and navigate is much harder to copy.</p>
    <p class="who">Arunika accounts are protected by behavior recognition, checked on Arunika's server.</p>
  </div>
</div>
<script src="assets/app.js"></script>
<script>
(function () {
  const A = Arunika;
  document.getElementById('logo').innerHTML = A.I.logo + '<span>arunika</span>';
  if (A.sesi()) { location.replace('home.html'); return; }
  const q = new URLSearchParams(location.search).get('keluar');
  const box = document.getElementById('alasan');
  if (q === 'diblokir') box.innerHTML = `<div class="banner bn-bad">${A.I.alert}<div><div class="t">Your previous session was ended</div><div>Activity on this account did not match its owner. If that was you, log in again and verify.</div></div></div>`;
  else if (q) box.innerHTML = `<div class="banner bn-info">${A.I.info}<div>You are logged out.</div></div>`;

  const f = document.getElementById('f'), email = document.getElementById('email'), sandi = document.getElementById('sandi'), err = document.getElementById('err');
  const last = localStorage.getItem('arunika:email-terakhir');
  if (last) { email.value = last; sandi.focus(); } else email.focus();

  document.getElementById('note').innerHTML =
    '<b>Demo site.</b> No real money. Accounts live on this demo\'s own server, so the same account opens from another browser or laptop. '
    + '<a href="#" id="contoh">Use the sample account</a> to look around first '
    + '(<span class="num">nadia.putri@example.com</span> / <span class="num">arunika123</span>, the password to try from a second laptop).';
  document.getElementById('contoh').onclick = async e => {
    e.preventDefault();
    if (!(await A.akunContoh())) { err.textContent = 'Arunika could not be reached.'; return; }
    localStorage.setItem('arunika:email-terakhir', 'nadia.putri@example.com');
    location.href = 'home.html';
  };

  let busy = false;
  f.addEventListener('submit', async e => {
    e.preventDefault();
    if (busy) return;
    err.textContent = '';
    email.removeAttribute('aria-invalid'); sandi.removeAttribute('aria-invalid');
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value.trim())) { err.textContent = 'That email is not valid.'; email.setAttribute('aria-invalid', 'true'); email.focus(); return; }
    if (sandi.value.length < 6) { err.textContent = 'Password must be at least 6 characters.'; sandi.setAttribute('aria-invalid', 'true'); sandi.focus(); return; }
    busy = true;
    const r = await A.masuk(email.value.trim().toLowerCase(), sandi.value);
    busy = false;
    if (!r.ok) {
      if (r.alasan === 'tidak-terdaftar') { err.innerHTML = 'No account uses this email. <a href="signup.html">Open an account first</a>.'; email.setAttribute('aria-invalid', 'true'); email.focus(); }
      else if (r.alasan === 'sandi') { err.textContent = 'The email or password is not right.'; sandi.setAttribute('aria-invalid', 'true'); sandi.select(); }
      else err.textContent = r.alasan;
      return;
    }
    localStorage.setItem('arunika:email-terakhir', email.value.trim().toLowerCase());
    location.href = 'home.html';
  });
})();
</script>
</body>
</html>
