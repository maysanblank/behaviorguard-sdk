<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pay & top up · Arunika</title>
<link rel="stylesheet" href="assets/app.css">
<style>
  .opsi{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:16px}
  @media (max-width:560px){.opsi{grid-template-columns:repeat(2,minmax(0,1fr))}}
  .opsi button{font:inherit;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;cursor:pointer}
  .opsi button b{display:block;font-size:14.5px}
  .opsi button span{font-size:12.5px;color:var(--ink-3)}
  .opsi button[aria-pressed=true]{border-color:var(--brand);background:var(--brand-soft)}
  .tag{display:flex;justify-content:space-between;padding:12px 14px;border:1px dashed var(--line);border-radius:10px;margin-bottom:14px;font-size:14px}
</style>
</head>
<body>
<header id="top"></header>
<main class="wrap">
  <div class="page-hd"><div><h1>Pay & top up</h1><p>Phone credit, electricity tokens and monthly bills.</p></div></div>
  <div class="grid g-2">
    <section class="card card-b">
      <div class="tabs" role="tablist" id="tabs">
        <button class="tab" role="tab" aria-selected="true" data-t="pulsa">Credit & data</button>
        <button class="tab" role="tab" aria-selected="false" data-t="listrik">Electricity</button>
        <button class="tab" role="tab" aria-selected="false" data-t="air">Water</button>
        <button class="tab" role="tab" aria-selected="false" data-t="internet">Internet</button>
      </div>
      <form id="f" novalidate>
        <div class="field"><label for="no" id="lbl-no"></label>
          <input class="input num" id="no" inputmode="numeric" autocomplete="off">
          <span class="hint" id="hint"></span></div>
        <div id="pilih"></div>
        <div class="err" id="err" role="alert"></div>
        <button class="btn btn-pri" type="submit" id="btn">Pay</button>
      </form>
    </section>
    <aside class="grid" style="align-content:start">
      <section class="card card-b"><h3>Available balance</h3><div class="num" style="font-size:22px;font-weight:700;margin-top:4px" id="saldo"></div></section>
      <section class="card"><div class="card-h"><h2>Recent payments</h2></div><ul class="list" id="last"></ul></section>
    </aside>
  </div>
</main>
<footer id="foot"></footer>
<script src="../../dist/behaviorguard.js"></script>
<script src="assets/app.js"></script>
<script src="assets/bg-integration.js"></script>
<script src="assets/demo-panel.js"></script>
<script>
(function () {
  const A = Arunika, a = A.shell('pay.html');
  if (!a) return;
  const $ = id => document.getElementById(id);
  const JENIS = {
    pulsa: { lbl: 'Mobile number', ph: '08xx xxxx xxxx', hint: 'The number to top up.', ic: 'phone',
      opsi: [['Credit 25,000', 26500], ['Credit 50,000', 51500], ['Credit 100,000', 101000], ['Data 10 GB', 65000], ['Data 25 GB', 110000], ['Data 50 GB', 175000]] },
    listrik: { lbl: 'Meter number / customer ID', ph: '11-12 digits', hint: 'Printed on the meter or a previous receipt.', ic: 'bolt',
      opsi: [['Token 50,000', 52500], ['Token 100,000', 102500], ['Token 200,000', 202500], ['Token 500,000', 502500], ['Token 1,000,000', 1002500], ['Token 2,500,000', 2502500]] },
    air: { lbl: 'Customer number', ph: '8 digits', hint: 'This month\'s bill will be shown.', ic: 'drop', tagihan: 96000 },
    internet: { lbl: 'Customer number', ph: '10 digits', hint: 'This month\'s bill will be shown.', ic: 'wifi', tagihan: 335000 },
  };
  let jenis = 'pulsa', pilihan = null;
  const saldo = () => { $('saldo').textContent = A.rupiah(A.akun().saldo); };
  function last() {
    const tx = A.akun().tx.filter(t => t.kat === 'Bills').slice(0, 5);
    $('last').innerHTML = tx.map(t => `<li class="row"><div class="ico">${A.I.bill}</div><div class="main"><div class="t">${A.esc(t.ket)}</div><div class="s">${A.tanggal(t.t)}</div></div><div class="amt num">${A.rupiah(-t.jml)}</div></li>`).join('') || '<li class="empty">No payments yet.</li>';
  }
  function tab(t) {
    jenis = t; pilihan = null; $('err').textContent = ''; $('no').value = '';
    document.querySelectorAll('#tabs .tab').forEach(b => b.setAttribute('aria-selected', String(b.dataset.t === t)));
    const J = JENIS[t];
    $('lbl-no').textContent = J.lbl; $('no').placeholder = J.ph; $('hint').textContent = J.hint;
    if (J.opsi) {
      $('pilih').innerHTML = `<div class="field" style="margin-bottom:6px"><label>Choose an amount</label></div><div class="opsi" id="opsi">${J.opsi.map(([n, h], i) => `<button type="button" aria-pressed="false" data-i="${i}"><b>${A.esc(n)}</b><span>${A.rupiah(h)}</span></button>`).join('')}</div>`;
      $('opsi').addEventListener('click', e => {
        const b = e.target.closest('[data-i]'); if (!b) return;
        pilihan = J.opsi[+b.dataset.i];
        document.querySelectorAll('#opsi button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
      });
    } else $('pilih').innerHTML = '';
  }
  $('no').addEventListener('input', () => {
    $('no').value = $('no').value.replace(/\D/g, '').slice(0, 13);
    const J = JENIS[jenis];
    if (J.tagihan) {
      const cukup = $('no').value.length >= 8;
      pilihan = cukup ? ['Bill for ' + new Date().toLocaleDateString('en-GB', { month: 'long', year: 'numeric' }), J.tagihan + 2500] : null;
      $('pilih').innerHTML = cukup ? `<div class="tag"><span>${A.esc(pilihan[0])}<br><span class="small muted">includes a Rp 2,500 admin fee</span></span><b class="num">${A.rupiah(pilihan[1])}</b></div>` : '';
    }
  });
  $('tabs').addEventListener('click', e => { const b = e.target.closest('[data-t]'); if (b) tab(b.dataset.t); });
  $('f').addEventListener('submit', async e => {
    e.preventDefault();
    const n = $('no').value;
    if (n.length < 8) return ($('err').textContent = 'The number is incomplete.');
    if (!pilihan) return ($('err').textContent = 'Choose an amount first.');
    if (pilihan[1] > A.akun().saldo) return ($('err').textContent = 'Insufficient balance.');
    $('err').textContent = '';
    const b = $('btn'); b.disabled = true; b.textContent = 'Checking';
    // The payment is made by Arunika's server, which asks BehaviorGuard first (guard.check).
    const res = await Guard.act('payment', { amount: pilihan[1], label: 'make this payment' },
      () => A.api('/api/pay', { kind: jenis, label: pilihan[0], number: n, amount: pilihan[1] }));
    b.disabled = false; b.textContent = 'Pay';
    if (res.ended) return;
    if (res.cancelled) return ($('err').textContent = 'Payment cancelled because verification was not completed.');
    if (!res.ok) return ($('err').textContent = (res.body && res.body.error) || 'The payment could not be made.');
    A.setAkun(res.body.account);
    const ref = res.body.ref, token = res.body.token;
    const d = A.dialog(`<div class="receipt"><div class="okc">${A.I.check}</div><h2>Payment complete</h2><div class="big num">${A.rupiah(pilihan[1])}</div><p class="muted">${A.esc(pilihan[0])}</p></div>
      <dl class="kv" style="margin-top:14px"><dt>Number</dt><dd class="num">${A.esc(n)}</dd>${token ? `<dt>Token</dt><dd class="num">${token}</dd>` : ''}<dt>Reference</dt><dd class="num">${ref}</dd></dl>
      <div class="acts"><button class="btn btn-pri" data-ok>Done</button></div>`);
    d.el.querySelector('[data-ok]').onclick = d.close; d.el.querySelector('[data-ok]').focus();
    saldo(); last(); tab(jenis);
  });
  saldo(); last(); tab('pulsa');
})();
</script>
</body>
</html>
