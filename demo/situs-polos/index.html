<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nusantara Mart — Toko Polos (tanpa 1 baris BG)</title>
<style>body{font-family:system-ui,Segoe UI,Roboto,sans-serif;margin:0;background:#f6f7f8;color:#111}
header{background:#fff;border-bottom:1px solid #e5e7eb;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;padding:18px}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:12px}
button{background:#0a7a63;color:#fff;border:0;border-radius:999px;padding:10px 14px;cursor:pointer;font-weight:700}
#cart{position:fixed;right:12px;bottom:12px;background:#111;color:#fff;padding:10px 14px;border-radius:999px}
input,textarea{width:100%;padding:8px;border:1px solid #d1d5db;border-radius:8px;margin:6px 0}
</style></head><body>
<header><b>Nusantara Mart — Toko Polos</b><span>Polos: NOL import SDK di file ini</span></header>
<div style="padding:12px 18px;background:#fffbe6;border-bottom:1px solid #f0d48a">Coba: ketik, klik produk, isi alamat — perilaku direkam dari LUAR oleh pemantau.</div>
<div class="grid" id="grid"></div>
<div style="max-width:520px;margin:18px;padding:14px;background:#fff;border:1px solid #e5e7eb;border-radius:12px">
  <h3>Checkout</h3>
  <input id="alamat" placeholder="Alamat pengiriman — ketik sungguhan">
  <textarea id="catatan" placeholder="Catatan — ketik sungguhan"></textarea>
  <button id="bayar">Bayar sekarang</button>
  <div id="status" style="margin-top:8px;color:#555"></div>
</div>
<div id="cart">Keranjang: <span id="n">0</span></div>
<script>
const products=["Kopi Gayo","Teh Melati","Gula Aren","Keripik Singkong","Sambal Roa","Beras Pandan"];
const grid=document.getElementById('grid');
let n=0;
products.forEach(p=>{
  const c=document.createElement('div'); c.className='card';
  c.innerHTML=`<div style="height:90px;background:#f3f4f6;border-radius:8px"></div><div style="margin:8px 0;font-weight:700">${p}</div><button>+ Keranjang</button>`;
  c.querySelector('button').onclick=()=>{ n++; document.getElementById('n').textContent=n; // cart event via DOM
    document.dispatchEvent(new CustomEvent('bg-cart',{bubbles:true}));
    // also push synthetic event for demo pemantau bridge
    window.dispatchEvent(new CustomEvent('BG_SYNTH', {detail:{event_type:'CART_ACTION'}}));
  };
  grid.appendChild(c);
});
document.getElementById('bayar').onclick=()=>{
  document.getElementById('status').textContent='Pesanan diproses… (jika pemantau aktif, risiko dinilai dari LUAR tanpa ubah file ini)';
};
// bukti fungsional polos: file ini tidak import sdk/behaviorguard.js sama sekali (cek Network tab)
// klaim "0 kemunculan kata" dihapus — yang benar: 0 import, 0 eksekusi SDK
</script>
</body></html>
