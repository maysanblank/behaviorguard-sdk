<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>One-Click Store - checkout with no protection</title>
<style>
  :root{ --ink:#111827; --muted:#6b7280; --line:#e5e7eb; --brand:#0a7a63; }
  *{box-sizing:border-box}
  body{font-family:system-ui,Segoe UI,Roboto,sans-serif;margin:0;background:#f6f7f8;color:var(--ink)}
  header{background:#fff;border-bottom:1px solid var(--line);padding:14px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5;gap:12px}
  header b{font-size:18px}
  .tag{font-size:12px;color:#b45309;background:#fffbeb;border:1px solid #fde68a;padding:3px 10px;border-radius:999px}
  main{max-width:720px;margin:24px auto;padding:0 16px}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
  h2{margin:0 0 12px;font-size:16px}
  input[type=email],input[type=password]{width:100%;padding:11px;border:1px solid #d1d5db;border-radius:9px;margin:6px 0;font-size:15px}
  input[type=checkbox]{width:18px;height:18px;margin:0 10px 0 0;vertical-align:middle;accent-color:var(--brand)}
  label{display:flex;align-items:center;cursor:pointer}
  button{background:var(--brand);color:#fff;border:0;border-radius:999px;padding:11px 18px;cursor:pointer;font-weight:700;font-size:15px}
  button.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
  .row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:0}
  .muted{color:var(--muted);font-size:13px}
  .hidden{display:none}
  .err{color:#b91c1c;font-size:14px;min-height:20px;margin-top:8px}
  #receipt{background:#ecfdf5;border:1px solid #a7f3d0;color:#065f46;border-radius:10px;padding:12px;margin-top:12px}
</style>
</head>
<body>
<header>
  <b>One-Click Store</b>
  <span class="tag" data-bg-label>plain site - no MFA, no session protection</span>
</header>

<main>
  <!-- LOG IN (plain: email + password, no second factor) -->
  <section id="loginCard" class="card">
    <h2>Log in</h2>
    <input id="email" type="email" placeholder="your email" autocomplete="username">
    <input id="password" type="password" placeholder="password" autocomplete="current-password">
    <button id="btnLogin">Log in</button>
    <div class="err" id="loginErr"></div>
    <p class="muted">The first log-in with an email creates the account. Once logged in, whoever holds this session can check out.</p>
  </section>

  <!-- STORE + CHECKOUT (after log-in) -->
  <section id="shopCard" class="card hidden">
    <div class="row">
      <h2 style="margin:0">Shop <span class="muted" id="who"></span></h2>
      <button class="ghost" id="btnLogout">Log out</button>
    </div>
    <div id="products"></div>
    <div class="row"><b>Total</b><b id="total">Rp 0</b></div>
    <button id="btnCheckout" data-checkout style="width:100%;margin-top:12px">Pay now</button>
    <div class="err" id="payErr"></div>
    <div id="receipt" class="hidden"></div>
  </section>

  <section id="ordersCard" class="card hidden">
    <h2>Orders</h2>
    <div id="orders" class="muted">None yet.</div>
  </section>
</main>

<!--
  ===========================================================================
  INSTALL BEHAVIORGUARD HERE  (plug-and-play demo)
  Remove this comment so the line below is active. ONE line. Nothing else in
  this file changes.
  ---------------------------------------------------------------------------
  <script src="plug-behaviorguard.js" defer></script>
  ===========================================================================
-->

<script>
  // --- the store's own code: business only, ZERO BehaviorGuard ---
  let PRODUCTS = [], cart = new Set();
  const $ = s => document.querySelector(s);
  const rupiah = n => "Rp " + n.toLocaleString("id-ID");
  const post = (url, body) => fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {}) });

  async function refreshMe() {
    const d = await fetch("/api/me").then(r => r.json());
    PRODUCTS = d.products;
    if (d.user) showShop(d.user); else showLogin();
  }
  function showLogin() { $("#loginCard").classList.remove("hidden"); $("#shopCard").classList.add("hidden"); $("#ordersCard").classList.add("hidden"); }
  function showShop(user) {
    $("#loginCard").classList.add("hidden");
    $("#shopCard").classList.remove("hidden");
    $("#ordersCard").classList.remove("hidden");
    $("#who").textContent = "- " + user;
    renderProducts(); renderOrders();
  }
  function renderProducts() {
    $("#products").innerHTML = "";
    PRODUCTS.forEach(p => {
      const row = document.createElement("div"); row.className = "row";
      const label = document.createElement("label");
      const box = document.createElement("input"); box.type = "checkbox";
      label.append(box, " " + p.name);
      const price = document.createElement("span"); price.textContent = rupiah(p.price);
      row.append(label, price);
      box.onchange = () => { box.checked ? cart.add(p.id) : cart.delete(p.id); renderTotal(); };
      $("#products").appendChild(row);
    });
    renderTotal();
  }
  function renderTotal() {
    $("#total").textContent = rupiah(PRODUCTS.filter(p => cart.has(p.id)).reduce((s, p) => s + p.price, 0));
  }
  async function renderOrders() {
    const d = await fetch("/api/orders").then(r => r.json());
    $("#orders").textContent = d.orders.length ? "" : "None yet.";
    d.orders.forEach(o => { const line = document.createElement("div"); line.textContent = `${o.id} - ${rupiah(o.total)} - ${o.at}`; $("#orders").appendChild(line); });
  }

  $("#btnLogin").onclick = async () => {
    $("#loginErr").textContent = "";
    const r = await post("/api/login", { email: $("#email").value, password: $("#password").value }).then(r => r.json());
    if (r.ok) showShop(r.user); else $("#loginErr").textContent = r.error || "could not log in";
  };
  $("#btnLogout").onclick = async () => { await post("/api/logout"); cart.clear(); showLogin(); };

  $("#btnCheckout").onclick = async () => {
    $("#payErr").textContent = "";
    if (!cart.size) return ($("#payErr").textContent = "Pick something first.");
    const res = await post("/api/checkout", { items: [...cart] });
    const r = await res.json().catch(() => ({}));
    if (r.ok) {
      $("#receipt").classList.remove("hidden");
      $("#receipt").textContent = `Paid. ${r.order.id} - ${rupiah(r.order.total)}. Thank you.`;
      cart.clear(); document.querySelectorAll("#products input").forEach(c => { c.checked = false; });
      renderTotal(); renderOrders();
    } else {
      $("#receipt").classList.add("hidden");
      $("#payErr").textContent = r.error || "payment failed";
      if (res.status === 401) refreshMe();
    }
  };

  refreshMe();
</script>
</body>
</html>
