<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;width:344px;font:13px/1.4 Inter,system-ui;background:#0b0b11;color:#e2e8f0}
header{padding:12px 14px;display:flex;align-items:center;gap:8px;border-bottom:1px solid #2a2a3a}
.dot{width:8px;height:8px;border-radius:50%;background:#4ade80}
.card{margin:10px;background:#1a1a28;border:1px solid #2a2a3a;border-radius:10px;padding:12px}
.badge{padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700}
.LOW{background:rgba(74,222,128,.15);color:#4ade80}.MED{background:rgba(251,191,36,.15);color:#fbbf24}.HIGH{background:rgba(248,113,113,.15);color:#f87171}
button{width:100%;background:#fff;color:#000;border:0;border-radius:8px;padding:10px;font-weight:700;cursor:pointer}
.small{color:#94a3b8;font-size:11px}
</style></head><body>
<header><div class="dot" id="dot"></div><b>BehaviorGuard</b><span class="small" id="fp" style="margin-left:auto"></span></header>
<div class="card"><div id="risk" class="badge LOW">LOW</div><div id="score" style="font:20px/1.2 monospace;margin:6px 0">score 0.00</div><div id="reasons" class="small">-</div></div>
<div class="card"><div class="small">Enrollment</div><div style="height:7px;background:#2a2a3a;border-radius:99px;overflow:hidden;margin:6px 0"><div id="bar" style="height:100%;width:0;background:#4ade80"></div></div><div id="enroll" class="small">0/10</div><button id="train">Latih</button></div>
<div class="card"><button id="toggle">Proteksi: ON</button><div class="small" id="status">on-device • HMAC • encrypted</div></div>
<script type="module">
import {getFingerprint} from './core/fingerprint.js';
getFingerprint().then(fp=> document.getElementById('fp').textContent=fp.slice(0,6));
chrome.runtime.sendMessage({type:'GET_STATE'}, s=>{
  if(!s) return;
  document.getElementById('risk').textContent=s.lastRisk||'LOW';
  document.getElementById('risk').className='badge '+(s.lastRisk||'LOW');
  document.getElementById('enroll').textContent=(s.trainValid||0)+'/10';
  document.getElementById('bar').style.width=Math.min(100,(s.trainValid||0)/10*100)+'%';
});
document.getElementById('train').onclick=()=> chrome.runtime.sendMessage({type:'TRAIN'});
</script>
</body></html>
