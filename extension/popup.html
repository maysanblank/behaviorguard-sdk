<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;width:344px;font:13px/1.4 Inter,system-ui;background:#0b0b11;color:#e2e8f0}
header{padding:12px 14px;display:flex;align-items:center;gap:8px;border-bottom:1px solid #2a2a3a}
.card{margin:10px;background:#1a1a28;border:1px solid #2a2a3a;border-radius:10px;padding:12px}
.badge{padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700}
.LOW{background:rgba(74,222,128,.15);color:#4ade80}.MEDIUM{background:rgba(251,191,36,.15);color:#fbbf24}.HIGH{background:rgba(248,113,113,.15);color:#f87171}
.small{color:#94a3b8;font-size:11px}
</style></head><body>
<header><b>BehaviorGuard</b><span class="small" id="origin" style="margin-left:auto">-</span></header>
<div class="card"><div class="small">Status on this site</div><div id="risk" class="badge LOW" style="display:inline-block;margin-top:6px">-</div></div>
<div class="card"><div class="small">Enrollment (per site)</div>
  <div style="height:7px;background:#2a2a3a;border-radius:99px;overflow:hidden;margin:6px 0"><div id="bar" style="height:100%;width:0;background:#4ade80"></div></div>
  <div id="enroll" class="small">-</div><div id="buf" class="small"></div></div>
<div class="card small">Every assessment happens on this device. The characters you type are not stored
(replaced by per-page tokens). Local storage is HMAC-signed to detect tampering, <b>not encrypted</b>.</div>
<script type="module">
// C-41: the "Train" and "Protect" buttons used to be wired to nothing, and the "encrypted"
// label was not true. The popup now only shows state that really exists.
const [tab] = await chrome.tabs.query({ active: true, currentWindow: true });
let origin = '';
try { origin = new URL(tab.url).origin; } catch {}
document.getElementById('origin').textContent = origin || '-';
if (origin.startsWith('http')) chrome.runtime.sendMessage({ type: 'GET_STATE', origin }, s => {
  if (!s || !s.ok) return;
  const r = document.getElementById('risk'); r.textContent = s.enrolled < s.baseline ? 'ENROLLING' : s.lastRisk; r.className = 'badge ' + (s.lastRisk || 'LOW');
  document.getElementById('enroll').textContent = `${s.enrolled}/${s.baseline} assessments collected`;
  document.getElementById('bar').style.width = Math.min(100, s.enrolled / s.baseline * 100) + '%';
  document.getElementById('buf').textContent = `evidence so far: ${s.buffered}/${s.need} events`;
});
</script>
</body></html>
