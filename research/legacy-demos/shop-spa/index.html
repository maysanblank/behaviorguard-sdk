<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pasar Loka - belanja sayur & bumbu segar</title>
<style>
  :root{
    --bg:#0E1512; --surface:#16201C; --surface-2:#1D2A24; --line:#2A3A32;
    --ink:#E9F2EC; --ink-2:#A3B5AB; --brand:#4ADE80; --brand-ink:#08150E;
    --accent:#FBBF24; --danger:#F87171; --radius:16px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:16px/1.6 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
  .app{max-width:1080px;margin:0 auto;padding:0 20px 70px}
  header{background:rgba(14,21,18,.9);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
  .bar{max-width:1080px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:24px}
  .logo{font-weight:800;font-size:19px;color:var(--brand);cursor:pointer;white-space:nowrap}
  .logo span{color:var(--ink)}
  nav{display:flex;gap:6px;flex:1;flex-wrap:wrap}
  nav a{color:var(--ink-2);text-decoration:none;font-size:15px;padding:6px 12px;border-radius:999px}
  nav a:hover{background:var(--surface-2);color:var(--ink)}
  nav a.aktif{background:var(--brand);color:var(--brand-ink);font-weight:700}
  .keranjang-btn{background:var(--surface-2);border:1px solid var(--line);color:var(--ink);
    padding:8px 15px;border-radius:999px;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap}
  h1{font-size:29px;margin:32px 0 6px;letter-spacing:-.02em}
  h2{font-size:19px;margin:26px 0 12px}
  .sub{color:var(--ink-2);margin:0 0 22px}
  .rute{font:12px ui-monospace,Consolas,monospace;color:var(--ink-2);
    background:var(--surface);border:1px solid var(--line);border-radius:8px;
    padding:6px 11px;display:inline-block;margin-bottom:20px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(210px,100%),1fr));gap:16px}
  .kartu{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px;display:flex;flex-direction:column;gap:7px}
  .kartu .ikon{font-size:40px}
  .kartu h3{margin:0;font-size:16px}
  .kartu .satuan{font-size:13px;color:var(--ink-2)}
  .kartu .harga{font-weight:700;font-size:17px;margin-top:auto}
  .btn{border:0;border-radius:10px;padding:9px 14px;font:inherit;font-size:14px;font-weight:600;
    cursor:pointer;background:var(--brand);color:var(--brand-ink)}
  .btn:hover{filter:brightness(1.07)}
  .btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
  .btn.wide{width:100%}
  .btn.kecil{padding:7px 13px;font-size:13px}
  .btn.danger{background:transparent;color:var(--danger);border:1px solid var(--line)}
  .baris{display:flex;align-items:center;gap:14px;background:var(--surface);
    border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px}
  .baris .ikon{font-size:30px}
  .baris .isi{flex:1;min-width:0}
  .baris .isi b{display:block}
  .baris .isi span{font-size:13px;color:var(--ink-2)}
  .qty{display:inline-flex;align-items:center;gap:9px}
  .qty button{width:29px;height:29px;border-radius:8px;border:1px solid var(--line);
    background:var(--surface-2);color:var(--ink);cursor:pointer;font-size:15px;line-height:1}
  .qty span{min-width:22px;text-align:center;font-variant-numeric:tabular-nums}
  .total{display:flex;justify-content:space-between;background:var(--surface-2);
    border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;
    margin-top:16px;font-size:18px;font-weight:700}
  form{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px 24px}
  label{display:block;font-size:13px;font-weight:600;color:var(--ink-2);margin:14px 0 5px}
  input,textarea,select{width:100%;padding:10px 12px;border:1px solid var(--line);
    border-radius:10px;font:inherit;background:var(--surface-2);color:var(--ink)}
  input:focus,textarea:focus,select:focus{outline:2px solid var(--brand);outline-offset:1px}
  .dua{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
  @media(max-width:560px){.dua{grid-template-columns:1fr}}
  .ok{background:#12301F;border:1px solid #1F5136;color:var(--brand);
    padding:15px 17px;border-radius:12px;margin:18px 0}
  .kosong{background:var(--surface);border:1px dashed var(--line);border-radius:var(--radius);
    padding:44px 20px;text-align:center;color:var(--ink-2)}
  footer{border-top:1px solid var(--line);margin-top:46px;padding:22px 0;color:var(--ink-2);font-size:14px}
  .detail{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:26px;margin-top:24px}
  @media(max-width:720px){.detail{grid-template-columns:1fr}}
  .foto{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    height:250px;display:flex;align-items:center;justify-content:center;font-size:92px}
  .chip{display:inline-block;background:var(--surface-2);color:var(--accent);border-radius:999px;
    padding:3px 12px;font-size:12px;font-weight:700;margin-bottom:8px}
  #bilah-akun{display:flex;align-items:center;gap:9px;white-space:nowrap}
  .halo{font-size:14px;color:var(--ink-2)}
  .halo b{color:var(--ink)}
  .kotak-akun{max-width:420px;margin:30px auto 0;background:var(--surface);border:1px solid var(--line);
    border-radius:var(--radius);padding:22px 24px 26px}
  .tab-akun{display:flex;gap:6px;margin-bottom:4px}
  .tab-akun button{flex:1;border:1px solid var(--line);background:transparent;color:var(--ink-2);
    padding:9px 10px;border-radius:10px;font:inherit;font-size:13.5px;cursor:pointer}
  .tab-akun button.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink);font-weight:700}
  .pesan{color:var(--danger);font-size:13px;min-height:18px;margin:10px 0 0}
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="logo" data-ke="/">Pasar<span>Loka</span></div>
    <nav id="nav">
      <a href="/" data-ke="/">Belanja</a>
      <a href="/keranjang" data-ke="/keranjang">Keranjang</a>
      <a href="/checkout" data-ke="/checkout">Bayar</a>
      <a href="/tentang" data-ke="/tentang">Tentang</a>
    </nav>
    <button class="keranjang-btn" data-ke="/keranjang">🧺 <span id="jml">0</span></button>
    <div id="bilah-akun"></div>
  </div>
</header>

<main class="app" id="layar"></main>

<footer><div class="app" style="padding-bottom:0">
  Pasar Loka - aplikasi satu halaman (SPA). Pindah menu memakai History API
  <code>pushState</code>, tanpa memuat ulang halaman sama sekali.
</div></footer>

<script>
(function () {
  'use strict';

  var BARANG = [
    { id:'bayam',   nama:'Bayam Hijau',      satuan:'ikat 250g', harga:6000,  ikon:'🥬', ket:'Dipetik pagi dari kebun Lembang. Tanpa pestisida sintetis.' },
    { id:'tomat',   nama:'Tomat Ceri',       satuan:'pak 500g',  harga:18000, ikon:'🍅', ket:'Manis, kulit tipis. Cocok untuk salad dan sambal matah.' },
    { id:'cabai',   nama:'Cabai Rawit Merah',satuan:'100g',      harga:12000, ikon:'🌶️', ket:'Pedas tingkat 8/10. Dari petani Brebes.' },
    { id:'bawang',  nama:'Bawang Merah',     satuan:'500g',      harga:22000, ikon:'🧅', ket:'Bawang Brebes asli, kering angin, tahan 3 minggu.' },
    { id:'jahe',    nama:'Jahe Emprit',      satuan:'250g',      harga:15000, ikon:'🫚', ket:'Lebih pedas dari jahe gajah. Bagus untuk wedang.' },
    { id:'telur',   nama:'Telur Ayam Kampung',satuan:'10 butir', harga:34000, ikon:'🥚', ket:'Dari peternakan kecil di Sleman, ayam umbaran.' },
    { id:'tempe',   nama:'Tempe Kedelai',    satuan:'papan 400g',harga:9000,  ikon:'🟫', ket:'Fermentasi 36 jam, dibungkus daun pisang.' },
    { id:'jeruk',   nama:'Jeruk Baby',       satuan:'1 kg',      harga:28000, ikon:'🍊', ket:'Manis segar, kulit tipis, dari Pacitan.' }
  ];

  /* ---------- akun ----------
     Aplikasi nyata tahu siapa yang sedang masuk. Yang aktif diumumkan lewat
     `window.penggunaAktif` supaya skrip pihak ketiga tidak perlu menebak. */
  var AKUN_KEY='pasar-loka-akun', SESI_KEY='pasar-loka-sesi';
  function semuaAkun(){ try{ return JSON.parse(localStorage.getItem(AKUN_KEY)||'{}'); }catch(e){ return {}; } }
  function simpanAkun(a){ try{ localStorage.setItem(AKUN_KEY, JSON.stringify(a)); }catch(e){} }
  function segarkanPengguna(){
    var e=null; try{ e=localStorage.getItem(SESI_KEY); }catch(x){}
    var a=e? semuaAkun()[e] : null;
    window.penggunaAktif = a ? {email:e, nama:a.nama} : null;
    return window.penggunaAktif;
  }
  segarkanPengguna();
  function bilahAkun(){
    var el=document.getElementById('bilah-akun'); if(!el) return;
    var u=window.penggunaAktif;
    el.innerHTML = u
      ? '<span class="halo">Halo, <b>'+u.nama+'</b></span><button class="btn kecil ghost" id="btn-keluar">Keluar</button>'
      : '<button class="btn kecil" data-ke="/masuk">Masuk / Daftar</button>';
    var k=document.getElementById('btn-keluar');
    if(k) k.onclick=function(){ try{ localStorage.removeItem(SESI_KEY); }catch(e){} segarkanPengguna(); ke('/masuk'); };
  }

  var KEY = 'pasar-loka-keranjang';
  var layar = document.getElementById('layar');

  function baca(){ try { return JSON.parse(localStorage.getItem(KEY)||'{}'); } catch(e){ return {}; } }
  function tulis(k){ try { localStorage.setItem(KEY, JSON.stringify(k)); } catch(e){} badge(); }
  function badge(){ var k=baca(),n=0; for(var i in k) n+=k[i]; document.getElementById('jml').textContent=n; }
  function rp(n){ return 'Rp'+n.toLocaleString('id-ID'); }
  function cari(id){ for(var i=0;i<BARANG.length;i++) if(BARANG[i].id===id) return BARANG[i]; return null; }
  function set(id,n){ var k=baca(); if(n<1) delete k[id]; else k[id]=n; tulis(k); }
  function tambah(id,n){ var k=baca(); set(id,(k[id]||0)+(n||1)); }

  /* ---------- router: History API, nol muat-ulang ---------- */
  // BASIS dihitung sekali dari URL awal. Rute disimpan di QUERY (?r=/keranjang),
  // bukan di path, karena server statis biasa (python -m http.server, GitHub Pages,
  // folder mana pun) tidak punya fallback SPA - memuat ulang di /keranjang akan 404
  // di tengah demo. Dengan query, `history.pushState` TETAP dipakai (itu yang
  // di-hook pelacak pihak ketiga) sekaligus refresh selalu mendarat di index.html.
  var BASIS = location.pathname.replace(/\/index\.html$/, '/').replace(/\/+$/, '/') || '/';
  function ke(path, ganti) {
    var penuh = BASIS + (path === '/' ? '' : '?r=' + encodeURIComponent(path));
    if (ganti) history.replaceState({}, '', penuh);
    else history.pushState({}, '', penuh);
    render();
  }
  window.addEventListener('popstate', render);
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-ke]');
    if (t) { e.preventDefault(); ke(t.getAttribute('data-ke')); }
  });

  function render() {
    var p = new URLSearchParams(location.search).get('r') || '/';
    if (p.charAt(0) !== '/') p = '/' + p;

    [].forEach.call(document.querySelectorAll('#nav a'), function (a) {
      a.classList.toggle('aktif', a.getAttribute('data-ke') === p);
    });

    bilahAkun();
    if (!window.penggunaAktif) return layarMasuk();   // belum masuk: kunci seluruh aplikasi
    if (p === '/masuk')       { ke('/', true); return; }
    if (p === '/')            return layarBelanja(p);
    if (p === '/keranjang')   return layarKeranjang(p);
    if (p === '/checkout')    return layarCheckout(p);
    if (p === '/tentang')     return layarTentang(p);
    if (p.indexOf('/barang/') === 0) return layarDetail(p, p.slice(8));
    layar.innerHTML = '<h1>Halaman tidak ada</h1><p class="sub">Rute <code>'+p+'</code> tidak dikenal.</p>';
  }

  function rute(p){ return '<div class="rute">rute aktif: ' + p + ' - tanpa muat ulang</div>'; }

  function layarBelanja(p) {
    layar.innerHTML = '<h1>Sayur & bumbu segar</h1>' +
      '<p class="sub">Dipetik pagi, diantar sore. Wilayah Jabodetabek.</p>' + rute(p) +
      '<div class="grid">' + BARANG.map(function (b) {
        return '<article class="kartu"><div class="ikon">'+b.ikon+'</div>' +
          '<h3>'+b.nama+'</h3><div class="satuan">'+b.satuan+'</div>' +
          '<div class="harga">'+rp(b.harga)+'</div>' +
          '<button class="btn kecil ghost" data-ke="/barang/'+b.id+'">Lihat</button>' +
          '<button class="btn wide" data-beli="'+b.id+'">Masukkan keranjang</button></article>';
      }).join('') + '</div>';
  }

  function layarDetail(p, id) {
    var b = cari(id); if (!b) return layarBelanja('/');
    layar.innerHTML = rute(p) + '<div class="detail"><div class="foto">'+b.ikon+'</div><div>' +
      '<span class="chip">'+b.satuan+'</span><h1 style="margin:4px 0 8px">'+b.nama+'</h1>' +
      '<p class="sub">'+b.ket+'</p>' +
      '<p style="font-size:26px;font-weight:800;margin:6px 0 18px">'+rp(b.harga)+'</p>' +
      '<label for="n">Jumlah</label><div class="qty" style="margin-bottom:18px">' +
        '<button type="button" id="k">−</button><span id="n">1</span><button type="button" id="t">+</button></div>' +
      '<button class="btn" id="beli" style="padding:12px 22px">Masukkan keranjang</button>' +
      '<p style="margin-top:20px"><a href="/" data-ke="/" style="color:var(--brand)">&lsaquo; kembali belanja</a></p>' +
      '</div></div>';
    var n = 1, s = document.getElementById('n');
    document.getElementById('k').onclick = function(){ if(n>1){n--;s.textContent=n;} };
    document.getElementById('t').onclick = function(){ n++;s.textContent=n; };
    document.getElementById('beli').onclick = function(){ tambah(b.id,n); ke('/keranjang'); };
  }

  function layarKeranjang(p) {
    var k = baca(), ids = Object.keys(k);
    if (!ids.length) {
      layar.innerHTML = '<h1>Keranjang</h1>' + rute(p) +
        '<div class="kosong"><p>Belum ada barang.</p><button class="btn" data-ke="/">Mulai belanja</button></div>';
      return;
    }
    var total = 0;
    var isi = ids.map(function (id) {
      var b = cari(id); if (!b) return '';
      var sub = b.harga * k[id]; total += sub;
      return '<div class="baris"><div class="ikon">'+b.ikon+'</div>' +
        '<div class="isi"><b>'+b.nama+'</b><span>'+b.satuan+' · '+rp(b.harga)+'</span></div>' +
        '<div class="qty"><button type="button" data-kurang="'+id+'">−</button>' +
          '<span>'+k[id]+'</span><button type="button" data-tambah="'+id+'">+</button></div>' +
        '<div style="font-weight:700;min-width:92px;text-align:right">'+rp(sub)+'</div>' +
        '<button class="btn danger kecil" data-hapus="'+id+'">hapus</button></div>';
    }).join('');
    layar.innerHTML = '<h1>Keranjang</h1>' + rute(p) + isi +
      '<div class="total"><span>Total</span><span>'+rp(total)+'</span></div>' +
      '<p style="margin-top:18px;display:flex;gap:10px;flex-wrap:wrap">' +
        '<button class="btn ghost" data-ke="/">Lanjut belanja</button>' +
        '<button class="btn" data-ke="/checkout">Lanjut bayar</button></p>';
  }

  function layarCheckout(p) {
    var k = baca(), ids = Object.keys(k), total = 0;
    ids.forEach(function(id){ var b=cari(id); if(b) total+=b.harga*k[id]; });
    layar.innerHTML = '<h1>Pembayaran</h1><p class="sub">Antar sore ini, pukul 16.00-20.00.</p>' + rute(p) +
      '<p style="color:var(--ink-2);font-size:14px">Total belanja: <strong>'+rp(total)+'</strong> ('+ids.length+' jenis)</p>' +
      '<form id="f">' +
        '<div class="dua"><div><label for="nama">Nama penerima</label>' +
          '<input id="nama" required autocomplete="off"></div>' +
          '<div><label for="hp">Nomor WhatsApp</label><input id="hp" required autocomplete="off"></div></div>' +
        '<label for="alamat">Alamat lengkap</label><textarea id="alamat" rows="3" required></textarea>' +
        '<div class="dua"><div><label for="patokan">Patokan</label>' +
          '<input id="patokan" autocomplete="off"></div>' +
          '<div><label for="jam">Jam antar</label><select id="jam">' +
            '<option>16.00 - 18.00</option><option>18.00 - 20.00</option></select></div></div>' +
        '<label for="pesan">Pesan untuk kurir</label><textarea id="pesan" rows="2"></textarea>' +
        '<p style="margin-top:20px"><button class="btn" type="submit" style="padding:12px 24px">Pesan sekarang</button></p>' +
      '</form>';
    document.getElementById('f').addEventListener('submit', function (e) {
      e.preventDefault();
      var nama = document.getElementById('nama').value || 'Pelanggan';
      try { localStorage.removeItem(KEY); } catch(err){}
      badge();
      layar.innerHTML = '<h1>Pesanan masuk</h1>' +
        '<div class="ok"><strong>Terima kasih, '+nama+'.</strong><br>Kurir akan menghubungi lewat WhatsApp. ' +
        'Nomor pesanan <code>PL-'+Date.now().toString().slice(-6)+'</code>.</div>' +
        '<button class="btn" data-ke="/">Belanja lagi</button>';
    });
  }

  function layarMasuk() {
    var mode='daftar';
    function gambar(){
      layar.innerHTML = '<h1 style="text-align:center;margin-top:36px">Masuk ke Pasar Loka</h1>' +
        '<p class="sub" style="text-align:center">Buat akun baru, atau masuk kalau sudah pernah daftar.</p>' +
        '<div class="kotak-akun">' +
          '<div class="tab-akun">' +
            '<button type="button" data-m="daftar" class="'+(mode==='daftar'?'on':'')+'">Daftar akun baru</button>' +
            '<button type="button" data-m="masuk" class="'+(mode==='masuk'?'on':'')+'">Sudah punya akun</button></div>' +
          '<form id="form-akun">' +
            (mode==='daftar'?'<label for="nama">Nama lengkap</label><input id="nama" required autocomplete="off">':'') +
            '<label for="email">Alamat surel</label><input id="email" type="email" required autocomplete="off">' +
            '<label for="sandi">Kata sandi</label><input id="sandi" type="password" required autocomplete="off">' +
            '<p class="pesan" id="pesan-akun"></p>' +
            '<button class="btn wide" type="submit" style="margin-top:6px;padding:11px">' +
              (mode==='daftar'?'Buat akun':'Masuk')+'</button>' +
          '</form></div>';
      [].forEach.call(layar.querySelectorAll('[data-m]'), function(b){
        b.onclick=function(){ mode=b.getAttribute('data-m'); gambar(); }; });
      document.getElementById('form-akun').onsubmit=function(ev){
        ev.preventDefault();
        var email=document.getElementById('email').value.trim().toLowerCase();
        var sandi=document.getElementById('sandi').value;
        var pesan=document.getElementById('pesan-akun'); var daftar=semuaAkun();
        if(mode==='daftar'){
          if(daftar[email]){ pesan.textContent='Surel itu sudah terdaftar.'; return; }
          daftar[email]={nama:document.getElementById('nama').value.trim()||'Pelanggan', sandi:sandi};
          simpanAkun(daftar);
        } else {
          if(!daftar[email]){ pesan.textContent='Akun tidak ditemukan. Daftar dulu.'; return; }
          if(daftar[email].sandi!==sandi){ pesan.textContent='Kata sandi salah.'; return; }
        }
        try{ localStorage.setItem(SESI_KEY,email); }catch(e){}
        segarkanPengguna(); ke('/');
      };
    }
    gambar();
  }

  function layarTentang(p) {
    layar.innerHTML = '<h1>Tentang Pasar Loka</h1>' + rute(p) +
      '<p class="sub" style="max-width:62ch">Kami menghubungkan 40 petani kecil di Lembang, Brebes, ' +
      'dan Sleman langsung ke dapur rumah tangga. Tanpa tengkulak, harga ditentukan petani, ' +
      'dan barang dipanen setelah pesanan masuk.</p>' +
      '<h2>Kenapa satu halaman?</h2>' +
      '<p class="sub" style="max-width:62ch">Seluruh situs ini adalah satu berkas HTML. Pindah menu ' +
      'tidak memuat ulang apa pun - hanya <code>history.pushState</code> lalu isi layar diganti. ' +
      'Arsitektur ini yang biasanya bikin skrip pihak ketiga kehilangan jejak navigasi.</p>';
  }

  document.addEventListener('click', function (e) {
    var t = e.target, id;
    if (!t.getAttribute) return;
    if ((id = t.getAttribute('data-beli'))) {
      tambah(id, 1); t.textContent = 'Ditambahkan ✓';
      setTimeout(function(){ t.textContent = 'Masukkan keranjang'; }, 1000);
    } else if ((id = t.getAttribute('data-tambah'))) { set(id, baca()[id]+1); render(); }
    else if ((id = t.getAttribute('data-kurang'))) { set(id, baca()[id]-1); render(); }
    else if ((id = t.getAttribute('data-hapus')))  { set(id, 0); render(); }
  });

  badge();
  render();
})();
</script>
</body>
</html>
