<!doctype html><html><head><meta charset="utf-8"><title>BG smoke</title></head>
<body><h3>BehaviorGuard bundle smoke test</h3><pre id="out">running...</pre>
<!-- INILAH snippet plug-and-play satu tag: classic script, nol type=module -->
<script src="./behaviorguard.js" data-user="smoke@test"></script>
<script>
const out=document.getElementById('out'); const log=(...a)=>{out.textContent+="\n"+a.join(' ');console.log(...a);};
function fakeEvents(seed){
  const ev=[]; let t=Date.now(); let r=seed;
  const rnd=()=>{ r=(r*1103515245+12345)&0x7fffffff; return r/0x7fffffff; };
  let px=400,py=300;
  for(let i=0;i<160;i++){
    t+=25+Math.floor(rnd()*90);
    const roll=rnd();
    if(roll<0.6){ const nx=px+(rnd()-0.5)*120, ny=py+(rnd()-0.5)*120; const v=Math.hypot(nx-px,ny-py); px=nx;py=ny;
      ev.push({event_type:'MOUSE_MOVE',timestamp:t,x:nx,y:ny,velocity:v,page_url:'/p'+(i%3)}); }
    else if(roll<0.85){ ev.push({event_type:'KEYSTROKE',timestamp:t,key:String.fromCharCode(97+Math.floor(rnd()*26)),hold_time:60+rnd()*90,flight_time:40+rnd()*120,page_url:'/p'+(i%3)}); }
    else { ev.push({event_type:'MOUSE_CLICK',timestamp:t,x:px,y:py,velocity:rnd()*2,page_url:'/p'+(i%3)}); }
  }
  return ev;
}
(async()=>{
  try{
    log('BehaviorGuard present:', !!window.BehaviorGuard);
    const bg=window.BehaviorGuard._instance;
    await bg.clear();
    await bg.init({userId:'smoke@test', onRisk:e=>{}});
    let last=null;
    for(let s=0;s<14;s++){ last=await bg.scoreExternalEvents(fakeEvents(1000+s*7)); log(`sesi ${s+1}: level=${last?.level} conv=${last?.convergence} score=${(last?.score??0).toFixed(3)}`); }
    log('MODEL built:', bg.getState().hasModel);
    log('RESULT: OK - pipeline jalan tanpa error, model terbentuk =', bg.getState().hasModel);
  }catch(e){ log('FAIL:', e.message); console.error(e); }
})();
</script></body></html>
