<script src="behaviorguard.js" data-user="andi@example.com" defer></script>
<script>
  // Zero-callback: cukup dengar event DOM. Tanpa ubah kode aplikasi lain.
  addEventListener('behaviorguard:risk', e => {
    const r = e.detail;                 // {level, score, action, reasons, topFeatures}
    console.log('[BG]', r.level, r.score.toFixed(2), r.reasons);
    if (r.level === 'HIGH')   alert('Verifikasi tambahan (MFA) diperlukan');
    // if (r.level === 'MEDIUM') tampilkanReAuthHalus();
  });
</script>
