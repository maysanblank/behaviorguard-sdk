name: conformance

# Proves "one brain, many languages": every runtime must pass the SAME core/golden.json
# (319 checks, tolerance 1e-9). If any of them misses, the build goes red.

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Golden file in sync with bg_core.py
        run: python core/gen_golden.py --check
      - name: Python conformance
        run: python core/conformance.py

  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: JS conformance (headless)
        run: node core/conformance.node.mjs
      - name: WASM conformance (committed artefact)
        run: node ports/wasm/run.mjs

  stepup:
    # C-1: locks the "paste the phrase = pass MFA" hole. verify() must fail CLOSED
    # for incomplete/non-finite samples; if it loosens again, the build goes red.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Step-up layer regression
        run: node core/challenge.test.mjs
      - name: Detector gate regression (C-15)
        run: node core/ensemble.test.mjs
      - name: Integrity heuristics regression (C-16)
        run: node core/integrity.test.mjs
      - name: Lifecycle & integrator API (C-31..C-43)
        run: node core/lifecycle.test.mjs
      - name: Capture privacy (C-30, C-44)
        run: node core/privacy.test.mjs
      - name: Production step-up & real-world conditions (C-45)
        run: node core/stepup.test.mjs
      - name: Script-made input & fallback time limit (C-46)
        run: node core/c46.test.mjs
      - name: Minified bundle behaves identically to the full bundle
        run: node tools/min_check.mjs
      - name: Idle, compression, invariance (C-23, C-24, C-28)
        run: |
          node core/idle.test.mjs
          node core/idle.live.test.mjs
          node core/compress.test.mjs
          node core/invariance.test.mjs

  server:
    # C-49: backend mode. The server engine must take the library's decisions window by
    # window, the rhythm check must agree with challenge.js, and the gate must hold.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: pip install flask
      - name: Server API (tokens, sessions, gate, report, IDOR, XSS, CSP, rate limits)
        run: python server/test_app.py
      - name: engine.py == the JavaScript library (parity)
        run: python server/test_parity.py
      - name: rhythm.py == challenge.js
        run: python server/test_rhythm.py
      - name: The library over HTTP against a real server
        run: python server/test_backend_sdk.py
      - name: Demo bank backend (Arunika)
        run: python demo/arunika/test_server.py
      - name: Install demo, before and after the one line
        run: python demo/shop-checkout/test_install.py
      - name: dist/server/ is a copy of server/ and core/bg_core.py
        run: |
          fail=0
          for f in guard.py engine.py rhythm.py; do diff -q "server/$f" "dist/server/$f" || fail=1; done
          diff -q core/bg_core.py dist/server/bg_core.py || fail=1
          exit $fail

  sync:
    # C-9: sdk/ is the only source; extension/ is just a copy. If the two drift apart
    # (the orchestrator used to be left out of the sync), the build goes red.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: sdk/ and extension/ must be identical
        run: |
          fail=0
          for f in sdk/core/*.js; do
            b="extension/core/$(basename "$f")"
            diff -q "$f" "$b" >/dev/null 2>&1 || { echo "::error::drifted: $f vs $b"; fail=1; }
          done
          for t in storage.js behaviorguard.js; do
            diff -q "sdk/$t" "extension/$t" >/dev/null 2>&1 || { echo "::error::drifted: sdk/$t vs extension/$t"; fail=1; }
          done
          [ $fail -eq 0 ] && echo "sdk/ == extension/ : OK"
          exit $fail

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust conformance
        working-directory: ports/rust
        run: cargo run --release

  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '21' }
      - name: Java conformance
        working-directory: ports/java
        run: java BgConformance.java ../../core/golden.json

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Rebuild bg_core.wasm from the Rust source
        run: |
          cd ports/rust
          cargo build --release --target wasm32-unknown-unknown --lib
          cp target/wasm32-unknown-unknown/release/bg_core.wasm ../wasm/bg_core.wasm
      - name: WASM conformance (rebuilt)
        run: node ports/wasm/run.mjs
